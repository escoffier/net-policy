syntax = "proto3";
package netpolicy.v1;

import "proto/net_policy_common.proto";

// Streaming replacement for the one-way push channel (port 8888, PostServer).
// Runs ALONGSIDE the existing PostServer, which keeps sending byte-for-byte the
// same notifications on port 8888 -- see the migration plan for rationale.
service NetPolicyEvents {
  // Long-lived server-streaming RPC. One active call == one logical listener,
  // mirroring PostServer's single-connected-listener, replace-on-reconnect
  // semantics (PostServer::Accept, net-policy.cpp:360-369).
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream PolicyEvent);
}

message SubscribeEventsRequest {
  string client_id = 1;  // label only, no protocol meaning
}

message PolicyEvent {
  oneof event {
    PolicyMatchEvent policy_match = 1;
  }
}

// mirrors PostServer::SendMatchMsg's JSON body exactly, net-policy.cpp:379-383
message PolicyMatchEvent {
  L4Protocol    protocol    = 1;
  PolicyAction  action      = 2;
  FlowDirection direction   = 3;
  uint32 src_port    = 4;
  uint32 dst_port    = 5;
  string src_ip      = 6;
  string dst_ip      = 7;
  string policy_name = 8;
}
