[package]
name = "net_policy_events"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
tonic = "0.11"
prost = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-build = "0.11"
